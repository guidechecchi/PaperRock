name: i18n-validate
on:
  push:
    paths: ['i18n/**']
  pull_request:
    paths: ['i18n/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate i18n key parity
        run: |
          node -e '
          const fs=require("fs");
          const flat=(o,p="")=>Object.entries(o).flatMap(([k,v])=>typeof v==="object"&&v!==null?flat(v,p+k+"."):[p+k]);
          const langs=["en-US","pt-BR","zh-CN"];
          const sets=langs.map(l=>[l,flat(JSON.parse(fs.readFileSync("i18n/"+l+".json","utf8")))]);
          const ref=sets[0][1];
          let ok=true;
          for(const [l,keys] of sets){
            const missing=ref.filter(k=>!keys.includes(k));
            const extra=keys.filter(k=>!ref.includes(k));
            if(missing.length||extra.length){ok=false;console.log("::error ::"+l+" missing: "+missing.join(",")+" | extra: "+extra.join(","));}
            else{console.log(l+" OK ("+keys.length+" keys)");}
          }
          process.exit(ok?0:1);
          '
